services:
  postgres:
    image: postgres:16
    container_name: pedro-imoveis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pedro_imoveis
    ports:
      - "5434:5432"
    volumes:
      - pedro_imoveis_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pedro_imoveis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pedro_imoveis_postgres_data:
